
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuLuGo | Tvoje hory. Tvoja cesta.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f8f5;
      color: #17251b;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 680px;
      background: white;
      padding: 65px 30px;
      border-radius: 24px;
      box-shadow: 0 12px 40px #0000000a;
    }
    h1 {
      font-size: 64px;
      color: #237646;
      margin: 0 0 22px;
    }
    h2 { font-size: 28px; }
    p {
      color: #66736b;
      line-height: 1.8;
    }
    .tag {
      display: inline-block;
      padding: 12px 22px;
      margin: 20px 0;
      border-radius: 30px;
      background: #eaf5ed;
      color: #237646;
      font-weight: bold;
    }
    footer {
      margin-top: 25px;
      font-size: 14px;
    }
    a {
      color: #237646;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>LuLuGo</h1>
    <h2>Tvoje hory. Tvoja cesta.</h2>
    <p>
      Turistická aplikácia vytvorená pre objavovanie
      prírody, offline mapy a komunitu ľudí,
      ktorí radi vyrážajú von.
    </p>
    <div class="tag">LuLuGo už čoskoro</div>
    <footer>
      <a href="privacy/">Ochrana súkromia</a>
      <a href="support/">Podpora</a>
      <a href="vymazanie-uctu/">Vymazanie účtu</a>
      <p>© 2026 LuLuGo</p>
    </footer>
  </main>
</body>
</html>
